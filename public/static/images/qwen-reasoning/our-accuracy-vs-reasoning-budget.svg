<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="820" viewBox="0 0 1440 820" role="img" aria-labelledby="title desc">
  <title id="title">LiveCodeBench accuracy versus explicit Qwen reasoning cap</title>
  <desc id="desc">Line chart showing pass@1 accuracy across reasoning-token caps. Accuracy rises from 68 percent at 256 tokens to 86 percent at 8192 tokens and 88 percent at 12288 tokens. Free thinking is a dashed 86 percent reference line.</desc>
  <defs>
    <style>
      .bg { fill: #fbfaf8; }
      .title { font: 700 34px Arial, Helvetica, sans-serif; fill: #1f2937; }
      .subtitle { font: 600 17px Arial, Helvetica, sans-serif; fill: #6b7280; }
      .axis { stroke: #9ca3af; stroke-width: 1.5; }
      .grid { stroke: #ddd7cf; stroke-width: 1; }
      .tick { font: 600 14px Arial, Helvetica, sans-serif; fill: #737b85; }
      .axis-label { font: 700 17px Arial, Helvetica, sans-serif; fill: #1f2937; }
      .line { fill: none; stroke: #2f6fe4; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
      .free-line { stroke: #ef4444; stroke-width: 3; stroke-dasharray: 10 10; }
      .leader { fill: none; stroke-width: 2.25; stroke-linecap: round; }
      .callout-title { font: 700 19px Arial, Helvetica, sans-serif; fill: #1f2937; }
      .callout-body { font: 600 15px Arial, Helvetica, sans-serif; fill: #4b5563; }
      .callout-small { font: 600 13px Arial, Helvetica, sans-serif; fill: #6b7280; }
      .card { fill: rgba(255,255,255,.72); stroke: #e5ded6; stroke-width: 1; }
    </style>
  </defs>

  <rect class="bg" width="1440" height="820" />

  <text class="title" x="92" y="58">LiveCodeBench accuracy vs explicit Qwen reasoning cap</text>
  <text class="subtitle" x="92" y="88">Pinned 50-task LiveCodeBench slice. Positive caps are spaced by log2 budget.</text>

  <!-- Plot area: x 92..1110, y 128..672. X values use equally spaced log2 cap buckets. -->
  <g id="grid">
    <line class="grid" x1="92" y1="598.6" x2="1110" y2="598.6" />
    <line class="grid" x1="92" y1="504.8" x2="1110" y2="504.8" />
    <line class="grid" x1="92" y1="411.0" x2="1110" y2="411.0" />
    <line class="grid" x1="92" y1="317.2" x2="1110" y2="317.2" />
    <line class="grid" x1="92" y1="223.4" x2="1110" y2="223.4" />
    <line class="grid" x1="92" y1="129.7" x2="1110" y2="129.7" />

    <line class="grid" x1="118.5" y1="128" x2="118.5" y2="672" />
    <line class="grid" x1="270.3" y1="128" x2="270.3" y2="672" />
    <line class="grid" x1="422.1" y1="128" x2="422.1" y2="672" />
    <line class="grid" x1="573.9" y1="128" x2="573.9" y2="672" />
    <line class="grid" x1="725.8" y1="128" x2="725.8" y2="672" />
    <line class="grid" x1="877.6" y1="128" x2="877.6" y2="672" />
    <line class="grid" x1="1029.4" y1="128" x2="1029.4" y2="672" />
    <line class="grid" x1="1097.7" y1="128" x2="1097.7" y2="672" />
  </g>

  <g id="ticks">
    <text class="tick" x="76" y="604" text-anchor="end">65%</text>
    <text class="tick" x="76" y="510" text-anchor="end">70%</text>
    <text class="tick" x="76" y="416" text-anchor="end">75%</text>
    <text class="tick" x="76" y="322" text-anchor="end">80%</text>
    <text class="tick" x="76" y="229" text-anchor="end">85%</text>
    <text class="tick" x="76" y="135" text-anchor="end">90%</text>

    <text class="tick" x="118.5" y="718" text-anchor="middle">off</text>
    <text class="tick" x="270.3" y="718" text-anchor="middle">256</text>
    <text class="tick" x="422.1" y="718" text-anchor="middle">512</text>
    <text class="tick" x="573.9" y="718" text-anchor="middle">1024</text>
    <text class="tick" x="725.8" y="718" text-anchor="middle">2048</text>
    <text class="tick" x="877.6" y="718" text-anchor="middle">4096</text>
    <text class="tick" x="1029.4" y="718" text-anchor="middle">8192</text>
    <text class="tick" x="1097.7" y="718" text-anchor="middle">12288</text>
  </g>

  <line class="axis" x1="92" y1="128" x2="92" y2="672" />
  <line class="axis" x1="92" y1="672" x2="1110" y2="672" />
  <text class="axis-label" x="601" y="770" text-anchor="middle">Reasoning-token cap</text>
  <text class="axis-label" transform="translate(28 400) rotate(-90)" text-anchor="middle">Pass@1 accuracy</text>

  <line class="free-line" x1="92" y1="204.7" x2="1110" y2="204.7" />
  <text class="callout-body" x="410" y="190" text-anchor="middle" fill="#ef4444">Free thinking reference: 43/50, 86%</text>

  <polyline class="line" points="118.5,317.2 270.3,542.3 422.1,467.2 573.9,354.7 725.8,317.2 877.6,279.7 1029.4,204.7 1097.7,167.2" />

  <circle cx="118.5" cy="317.2" r="9" fill="#2f6fe4" stroke="#fbfaf8" stroke-width="3" />
  <circle cx="270.3" cy="542.3" r="9" fill="#2f6fe4" stroke="#fbfaf8" stroke-width="3" />
  <circle cx="422.1" cy="467.2" r="9" fill="#2f6fe4" stroke="#fbfaf8" stroke-width="3" />
  <circle cx="573.9" cy="354.7" r="9" fill="#2f6fe4" stroke="#fbfaf8" stroke-width="3" />
  <circle cx="725.8" cy="317.2" r="9" fill="#2f6fe4" stroke="#fbfaf8" stroke-width="3" />
  <circle cx="877.6" cy="279.7" r="9" fill="#2f6fe4" stroke="#fbfaf8" stroke-width="3" />
  <circle cx="1029.4" cy="204.7" r="10" fill="#13a45f" stroke="#fbfaf8" stroke-width="3" />
  <circle cx="1097.7" cy="167.2" r="10" fill="#f97316" stroke="#fbfaf8" stroke-width="3" />

  <!-- Right-side annotation gutter keeps labels out of the plot path. -->
  <rect class="card" x="1162" y="132" width="204" height="88" rx="6" />
  <path class="leader" d="M1097.7 167.2 C1128 158, 1138 154, 1154 154" stroke="#f97316" />
  <text class="callout-title" x="1178" y="164">12288 cap</text>
  <text class="callout-body" x="1178" y="190">44/50, 88%</text>
  <text class="callout-small" x="1178" y="210">one more pass than free</text>

  <rect class="card" x="1162" y="270" width="204" height="92" rx="6" />
  <path class="leader" d="M1029.4 204.7 C1084 224, 1128 256, 1154 296" stroke="#13a45f" />
  <text class="callout-title" x="1178" y="303">8192 cap</text>
  <text class="callout-body" x="1178" y="329">43/50, 86%</text>
  <text class="callout-small" x="1178" y="349">matched free thinking</text>
</svg>
